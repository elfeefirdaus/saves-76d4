<style>
:root{--bg:#0b0c0f;--card:#16181d;--card2:#1d2027;--line:#262932;--text:#f5f6f8;--muted:#9a9ea8;--lime:#c6f432;--blue:#4c8dff;--red:#ff5a5f;--serif:"New York",ui-serif,"Iowan Old Style",Georgia,serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 50% at 50% -10%,#1d2410 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--text);min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
a{color:var(--lime)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:6px}
.top .sp{flex:1}
a.homeapp,.back,.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:15px;justify-content:center}
.homeapp .ar,.back .ar{color:var(--lime)}
.iconbtn{width:44px;padding:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;display:flex;align-items:center;gap:12px}
h1 span{color:var(--lime)}
.logo{flex:none;width:48px;height:48px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.search{position:relative;margin:8px 0 10px}
.search input{width:100%;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px 0 40px;font-size:16px}
.search svg{position:absolute;left:13px;top:14px;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
.chip.on{background:var(--lime);color:#111;border-color:var(--lime)}
.chip .n{opacity:.6;font-weight:500}
.chip.cat{background:#252a52;border-color:#343b75;color:#c9cffc}
.chip.tag{color:var(--muted)}
.chip.ghost{border-style:dashed;color:var(--muted);background:transparent}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;align-items:stretch;position:relative}
.card.done .t{opacity:.55;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.th{flex:none;width:68px;height:90px;border-radius:12px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;font-size:26px;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .pb{position:absolute;left:4px;bottom:4px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.body .t{font-weight:700;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0}
.meta .au{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.mini span{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.mini span.c{background:#252a52;color:#c9cffc}
.mini span.sh{background:#2a2410;color:#f3d77a}
.side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;flex:none}
.tick,.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.tick .ring{width:24px;height:24px;border-radius:50%;border:2px solid #6b7080;display:grid;place-items:center}
.tick.on .ring{background:var(--lime);border-color:var(--lime)}
.tick.on .ring svg{display:block}.tick .ring svg{display:none}
.mark svg{fill:none;stroke:#6b7080;stroke-width:2}
.mark.on svg{fill:var(--blue);stroke:var(--blue)}
.pending{color:var(--lime);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:44px 18px;border:1px dashed var(--line);border-radius:20px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.empty .bigic{font-size:40px;margin-bottom:10px}
.fab{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 20px);height:56px;padding:0 22px;border-radius:999px;background:var(--lime);color:#111;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(198,244,50,.25),0 4px 12px rgba(0,0,0,.5);z-index:5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--text);text-decoration:none}
.btn.pri{background:var(--lime);color:#111;border-color:var(--lime)}
.btn.danger{color:var(--red)}
.btn.full{width:100%}
/* detail */
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--card2);margin-top:4px;aspect-ratio:4/3;display:grid;place-items:center;font-size:64px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .by{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2.title{font-family:var(--serif);font-size:28px;line-height:1.15;font-weight:800;margin:18px 0 14px;word-break:break-word}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.row .sp{flex:1}
.open{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;border:1px solid #3a3e48;font-weight:600;font-size:15px;color:var(--text);text-decoration:none}
.catsel{position:relative;flex:none}
.catsel select{appearance:none;-webkit-appearance:none;height:40px;border-radius:12px;background:#252a52;border:1px solid #343b75;color:#c9cffc;font-weight:700;font-size:15px;padding:0 30px 0 12px}
.catsel:after{content:"\25BE";position:absolute;right:11px;top:10px;color:#c9cffc;pointer-events:none;font-size:13px}
.dchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none;align-items:center}
.dchips::-webkit-scrollbar{display:none}
.dchips .chip{height:40px;border-radius:12px}
.chip .x{opacity:.6;margin-left:2px;font-size:16px;line-height:1}
.sec{border-top:1px solid var(--line);padding:14px 0}
.sechd{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:600;min-height:32px}
.caption{white-space:pre-wrap;line-height:1.45;font-size:15px;color:#d8dae0;margin-top:8px;word-break:break-word}
.caption.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{color:var(--lime);font-weight:600;font-size:14px;min-height:32px}
.show{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;text-decoration:none;color:inherit}
.show .po{flex:none;width:74px;height:104px;border-radius:12px;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-size:28px}
.show .po img{width:100%;height:100%;object-fit:cover}
.show .sn{font-weight:800;font-size:17px}
.show .sl{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.35}
.show .src{color:var(--muted);font-size:12px;margin-top:6px}
.ask{display:flex;gap:8px;margin-top:10px}
.ask .btn{flex:1;min-height:44px}
.lbl{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:0 0 6px}
textarea,.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4}
textarea{min-height:92px;resize:vertical}
.field{height:48px;padding:0 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin-top:8px}
.warn{background:#2a2410;border:1px solid #4a3f17;color:#f3d77a;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:4px 0 14px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{width:100%;max-width:560px;background:#14161b;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3e48;margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:12px}
.sheet .rowb{display:flex;gap:10px;margin-top:12px}
.sheet .rowb .btn{flex:1}
.res{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--line);margin-top:8px;width:100%;text-align:left;background:var(--card)}
.res img{width:40px;height:56px;border-radius:8px;object-fit:cover;background:var(--card2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#f5f6f8;color:#111;padding:11px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.set h3{font-size:17px;margin-bottom:6px}
.ok{color:var(--lime)}.bad{color:var(--red)}
body.sheeted .fab{display:none!important}

document.addEventListener('click', function (e) {

  if (d.done) { e.stopPropagation(); var x = byId(d.done); x.done = !x.done; dbPut(x); rerender(x.id); toast(x.done ? 'Marked done \u2713' : 'Marked to do'); return; }

  if (a === 'close') return closeSheet();

    }, function (er) { $('#htest').innerHTML = '<span class="bad">Couldn\u2019t reach the helper (' + esc(er.message || er) + ')</span>'; });
    return;
  }
  if (a === 'export') return exportBackup();

  if (a === 'yesshow') { it.show.status = 'confirmed'; if (!it.titleEdited) { it.origTitle = it.title; it.title = it.show.name; } dbPut(it); renderDetail(it.id, true); toast('Linked to ' + it.show.name); return; }
  if (a === 'noshow') { it.showDismissed = (it.showDismissed || []).concat([it.show.id]); it.show = null; dbPut(it); renderDetail(it.id, true); findShow(it); return; }
  if (a === 'unshow') { it.showDismissed = (it.showDismissed || []).concat([it.show.id]); if (!it.titleEdited && it.origTitle) it.title = it.origTitle; it.show = null; it.showStatus = ''; dbPut(it); renderDetail(it.id, true); return; }
  if (a === 'findshow') return openShowSearch(it);
  if (a === 'showsearch') {
    var q = $('#showq').value.trim(); if (!q) return;
    $('#showres').innerHTML = '<div class="note"><span class="spin"></span> Searching TVmaze\u2026</div>';
    tvSearch(q).then(function (l) {
      openShowSearch._l = l;
      $('#showres').innerHTML = l.length ? l.slice(0, 5).map(function (r, i) { var s = r.show; return '<button class="res" data-act="pickshow" data-i="' + i + '">' + (s.image ? '<img src="' + esc(s.image.medium) + '" alt="" referrerpolicy="no-referrer">' : '<img alt="">') + '<span><b>' + esc(s.name) + '</b><br><span class="note">' + esc([s.type, (s.premiered || '').slice(0, 4), (s.network || s.webChannel || {}).name].filter(Boolean).join(' \u00b7 ')) + '</span></span></button>'; }).join('') : '<div class="note">No shows found.</div>';
    });
    return;
  }
  if (a === 'pickshow') { var r = openShowSearch._l[+d.i]; buildShow(r.show).then(function (card) { card.status = 'confirmed'; it.show = card; if (!it.titleEdited) { it.origTitle = it.title; it.title = card.name; } return dbPut(it); }).then(function () { closeSheet(); renderDetail(it.id, true); toast('Linked to ' + it.show.name); }); return; }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'cat') { var it = byId(decodeURIComponent(location.hash.slice(4))); it.category = e.target.value; it.catAuto = false; dbPut(it); renderDetail(it.id, true); if ((it.category === 'TV Show' || it.category === 'Movie') && !it.show) findShow(it); }
  if (e.target.id === 'impfile' && e.target.files[0]) importBackup(e.target.files[0]);
});
var notesT;
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { filt.q = e.target.value; renderList(true); }
  if (e.target.id === 'notes') { var it = byId(decodeURIComponent(location.hash.slice(4))); it.notes = e.target.value; clearTimeout(notesT); notesT = setTimeout(function () { dbPut(it); }, 400); }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'addurl') { e.preventDefault(); $('[data-act="saveadd"]').click(); }
  if (e.target.id === 'tagin') { e.preventDefault(); $('[data-act="savetag"]').click(); }
  if (e.target.id === 'edtitle') { e.preventDefault(); $('[data-act="saveedit"]').click(); }
  if (e.target.id === 'showq') { e.preventDefault(); $('[data-act="showsearch"]').click(); }
});
$('#scrim').addEventListener('click', function (e) { if (e.target.id === 'scrim') closeSheet(); });
$('#fab').addEventListener('click', function () { openAdd(); });
window.addEventListener('hashchange', route);

// ---------- backup ----------
function exportBackup() {
  var data = JSON.stringify({ app: 'feeSaves', version: 1, exported: new Date().toISOString(), items: items }, null, 1);
  var name = 'saves-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  var blob = new Blob([data], { type: 'application/json' });
  var done = function () { saveSettings({ lastBackup: Date.now() }); toast('Backup ready: ' + items.length + ' saves'); };
  try {
    var f = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).then(done, function () {}); return; }
  } catch (e) {}
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); done();
}
function importBackup(file) {
  file.text().then(function (txt) {
    var j = JSON.parse(txt), inc = Array.isArray(j) ? j : j.items;
    if (!Array.isArray(inc)) throw new Error('Not a Saves backup');
    var r = C.mergeItems(items, inc);
    return Promise.all(r.items.map(function (x) { if (!x.id) x.id = newId(); return tx('readwrite', function (s) { s.put(x); }); })).then(function () { items = r.items; toast('Imported: ' + r.added + ' new, ' + r.updated + ' updated'); renderSettings(); });
  }).catch(function (er) { toast('Import failed: ' + (er.message || er)); });
}

// ---------- start ----------
function start() {
  openDb().then(function (d) { db = d; return dbAll(); }).then(function (all) { items = all || []; }).catch(function (e) { dbErr = (e && e.message) || 'blocked'; items = []; }).then(function () {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    var l = C.parseLaunch(location.search);
    if (l && db) {
      history.replaceState(null, '', location.pathname + location.hash);
      return addLink(l.url, { text: l.text }).then(function (it) { if (it) { history.replaceState(null, '', location.pathname + '#/i/' + it.id); } route(); });
    }
    route();
    items.forEach(function (it) { if (it.metaStatus === 'pending' && !busy[it.id]) enrich(it); });
    setTimeout(aiBackfill, 2500);
  });
}
start();
window.addEventListener('online', function () { setTimeout(aiBackfill, 2000); });
window.__saves = { helperUrl: helperUrl, items: function () { return items; }, addLink: addLink, enrich: enrich, findShow: findShow, aiEnrich: aiEnrich, aiBackfill: aiBackfill };
})();
</script>
